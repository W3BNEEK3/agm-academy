name: Build and Deploy to DirectAdmin server for agmacademy.co

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: 22
  TAR_NAME: agm-academy-prod.tar.gz
  UPLOAD_NODE_MODULES: ${{ secrets.UPLOAD_NODE_MODULES || 'false' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build
        run: npx next build --webpack

      - name: Create production tarball
        run: |
          rm -f $TAR_NAME
          if [ "${{ env.UPLOAD_NODE_MODULES }}" = "true" ]; then
            tar -czf $TAR_NAME .next node_modules public package.json next.config.ts package-lock.json
          else
            tar -czf $TAR_NAME .next public package.json next.config.ts package-lock.json
          fi
        env:
          TAR_NAME: ${{ env.TAR_NAME }}

      - name: Verify tarball contents
        run: |
          ls -lh $TAR_NAME
          echo "node_modules entries:"
          tar -tzf $TAR_NAME | grep node_modules | wc -l || true
        env:
          TAR_NAME: ${{ env.TAR_NAME }}

      - name: Copy tarball to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: ${{ env.TAR_NAME }}
          target: /home/${{ secrets.SSH_USER }}/

      - name: Extract on server and deploy
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 15m
          script: |
            set -e
            SSH_USER='${{ secrets.SSH_USER }}'
            TARGET_DIR='${{ secrets.TARGET_DIR }}'
            BACKUP_DIR="${TARGET_DIR}.bak.$(date +%s)"

            if [ -f "$TARGET_DIR/.htaccess" ]; then
              cp "$TARGET_DIR/.htaccess" /tmp/htaccess.bak
            fi

            if [ -d "$TARGET_DIR" ]; then
              mv "$TARGET_DIR" "$BACKUP_DIR"
            fi
            mkdir -p "$TARGET_DIR"

            nice -n 19 ionice -c2 -n7 tar -xzf /home/$SSH_USER/${{ env.TAR_NAME }} -C "$TARGET_DIR"

            if [ -f /tmp/htaccess.bak ]; then
              cp /tmp/htaccess.bak "$TARGET_DIR/.htaccess"
            elif [ -f "$BACKUP_DIR/.htaccess" ]; then
              cp "$BACKUP_DIR/.htaccess" "$TARGET_DIR/.htaccess"
            fi

            APP_REL_PATH="${TARGET_DIR#/home/$SSH_USER/}"
            NPM_BIN="/home/$SSH_USER/nodevenv/${APP_REL_PATH}/22/bin/npm"

            echo "Installing production dependencies on server..."
            (cd "$TARGET_DIR" && nice -n 19 "$NPM_BIN" install --omit=dev --no-audit --no-fund)

            mkdir -p "$TARGET_DIR/tmp"
            touch "$TARGET_DIR/tmp/restart.txt"

            ls -dt "${TARGET_DIR}".bak.* 2>/dev/null | tail -n +2 | xargs -r rm -rf
