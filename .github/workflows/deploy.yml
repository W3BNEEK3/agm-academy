name: Build and Deploy to DirectAdmin server for agmacademy.co

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: 22
  TAR_NAME: agm-academy-prod.tar.gz
  UPLOAD_NODE_MODULES: ${{ secrets.UPLOAD_NODE_MODULES || 'true' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build
        run: npx next build --webpack

      - name: Create production tarball
        run: |
          rm -f $TAR_NAME
          if [ "${{ env.UPLOAD_NODE_MODULES }}" = "true" ]; then
            tar -czf $TAR_NAME .next node_modules public package.json next.config.ts package-lock.json
          else
            tar -czf $TAR_NAME .next public package.json next.config.ts package-lock.json
          fi
        env:
          TAR_NAME: ${{ env.TAR_NAME }}

      - name: Verify tarball contents
        run: |
          ls -lh $TAR_NAME
          echo "node_modules entries:"
          tar -tzf $TAR_NAME | grep node_modules | wc -l || true
        env:
          TAR_NAME: ${{ env.TAR_NAME }}

      - name: Copy tarball to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: ${{ env.TAR_NAME }}
          target: /home/${{ secrets.SSH_USER }}/

      - name: Extract on server and deploy
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 15m
          script: |
            set -e
            SSH_USER='${{ secrets.SSH_USER }}'
            TARGET_DIR='${{ secrets.TARGET_DIR }}'
            BACKUP_DIR="${TARGET_DIR}.bak.$(date +%s)"

            # Preserve .htaccess across deploys
            if [ -f "$TARGET_DIR/.htaccess" ]; then
              cp "$TARGET_DIR/.htaccess" /tmp/htaccess.bak
            fi

            # Move current app to a fresh backup
            if [ -d "$TARGET_DIR" ]; then
              mv "$TARGET_DIR" "$BACKUP_DIR"
            fi
            mkdir -p "$TARGET_DIR"

            # Throttle extraction to avoid tripping the host's I/O and process quotas
            nice -n 19 ionice -c2 -n7 tar -xzf /home/$SSH_USER/${{ env.TAR_NAME }} -C "$TARGET_DIR" 2>/dev/null \
              || tar -xzf /home/$SSH_USER/${{ env.TAR_NAME }} -C "$TARGET_DIR"

            # Restore .htaccess
            if [ -f /tmp/htaccess.bak ]; then
              cp /tmp/htaccess.bak "$TARGET_DIR/.htaccess"
            elif [ -f "$BACKUP_DIR/.htaccess" ]; then
              cp "$BACKUP_DIR/.htaccess" "$TARGET_DIR/.htaccess"
            fi

            # Compute the app's path relative to nodevenv (mirrors domains/... structure)
            APP_REL_PATH="${TARGET_DIR#/home/$SSH_USER/}"
            NPM_BIN="/home/$SSH_USER/nodevenv/${APP_REL_PATH}/22/bin/npm"

            # Safety net: only kicks in if node_modules genuinely didn't make it
            MODULE_COUNT=0
            if [ -d "$TARGET_DIR/node_modules" ]; then
              MODULE_COUNT=$(find "$TARGET_DIR/node_modules" -mindepth 1 -maxdepth 1 | wc -l)
            fi

            if [ "$MODULE_COUNT" -lt 100 ] && [ -x "$NPM_BIN" ]; then
              echo "node_modules incomplete ($MODULE_COUNT entries) — running npm install as fallback (production only, no build)"
              (cd "$TARGET_DIR" && "$NPM_BIN" install --omit=dev) || true
            fi

            # Restart the Node app (LiteSpeed lsnode watches this file, same convention as Passenger)
            mkdir -p "$TARGET_DIR/tmp"
            touch "$TARGET_DIR/tmp/restart.txt"

            # Keep only the most recent backup to avoid disk/process buildup
            ls -dt "${TARGET_DIR}".bak.* 2>/dev/null | tail -n +2 | xargs
